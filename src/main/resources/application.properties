# Puerto de la aplicación
quarkus.http.port=8089

# Keycloak - Client Credentials Grant para Keycloak Admin API
# IMPORTANTE: Las credenciales deben estar en variables de entorno, NO hardcodeadas
keycloak.auth-server-url=${KEYCLOAK_URL:http://localhost:8083/}
keycloak.realm=${KEYCLOAK_REALM:billpay_app}

# Cliente con permisos administrativos (Service Account)
# Este cliente tiene permisos completos de realm-management para:
# - Gestionar roles
# - Crear y gestionar grupos
# - Asignar roles a grupos y usuarios
# - Ver y gestionar usuarios
keycloak.client-id=${KEYCLOAK_CLIENT_ID:cli_billpay_app}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# Configuración de seguridad
keycloak.ssl-required=external
keycloak.public-client=false
keycloak.bearer-only=false

# OpenAPI
quarkus.smallrye-openapi.path=/openapi
